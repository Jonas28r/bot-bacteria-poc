<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor con Esteganografía LSB</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        canvas {
            border: 2px solid #333;
            max-width: 100%;
            border-radius: 8px;
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e1e;
            border-left: 4px solid #00ff88;
            font-family: monospace;
            word-break: break-all;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <h2>Lector de Capítulo</h2>
    <!-- Usamos un canvas en lugar de un tag img normal -->
    <canvas id="visorCanvas"></canvas>
    
    <div id="resultado">Esperando decodificación...</div>

    <script>
        // 1. Cargamos la imagen "infectada"
        const img = new Image();
        img.src = 'output_infected.png'; 
        
        img.onload = function() {
            const canvas = document.getElementById('visorCanvas');
            const ctx = canvas.getContext('2d');
            
            // Ajustamos el tamaño del canvas a la imagen
            canvas.width = img.width;
            canvas.height = img.height;
            
            // 2. Dibujamos la imagen en el canvas (el usuario ve el capítulo normal)
            ctx.drawImage(img, 0, 0);
            
            // 3. Extraemos los píxeles
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let extractedBinary = "";
            let secretText = "";
            let bitCount = 0;
            let currentByte = "";

            // 4. Leemos los últimos bits de los píxeles para reconstruir el mensaje
            for (let i = 0; i < data.length; i += 4) {
                // Leemos solo el canal Rojo (igual que en el codificador)
                let red = data[i];
                
                // Extraemos el último bit (0 o 1)
                let lastBit = red & 1; 
                currentByte += lastBit;
                bitCount++;

                // Cada 8 bits forman una letra
                if (bitCount === 8) {
                    let charCode = parseInt(currentByte, 2);
                    let char = String.fromCharCode(charCode);
                    secretText += char;
                    
                    // Verificamos si llegamos a la etiqueta [END] que pusimos en el codificador
                    if (secretText.endsWith("[END]")) {
                        secretText = secretText.replace("[END]", "");
                        break; // Detenemos la lectura para ahorrar memoria
                    }
                    
                    currentByte = "";
                    bitCount = 0;
                }
            }

            // 5. Imprimimos el enlace secreto extraído
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `<strong>¡Enlace extraído del ADN de la imagen!</strong><br><br> ${secretText}`;
            
            // 6. El golpe final: Ejecución silenciosa (Ejemplo de Popunder encubierto)
            // Aquí puedes enlazar este 'secretText' a un evento de clic en el canvas
            canvas.addEventListener('click', () => {
                 window.open(secretText, '_blank');
            });
        };
    </script>
</body>
</html>
