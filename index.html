<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor con Esteganografía LSB (WEBP)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        canvas {
            border: 2px solid #333;
            max-width: 100%;
            border-radius: 8px;
            cursor: pointer; /* Añadimos un cursor para que parezca interactivo */
        }
        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e1e;
            border-left: 4px solid #00ff88;
            font-family: monospace;
            word-break: break-all;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <h2>Lector de Capítulo (WEBP)</h2>
    <!-- El lienzo donde pintaremos el cómic -->
    <canvas id="visorCanvas"></canvas>
    
    <div id="resultado">Esperando decodificación...</div>

    <script>
        // 1. Cargamos la imagen "infectada" en su nuevo formato WEBP
        const img = new Image();
        img.src = 'output_infected.webp'; 
        
        img.onload = function() {
            const canvas = document.getElementById('visorCanvas');
            const ctx = canvas.getContext('2d');
            
            // Ajustamos el tamaño del canvas
            canvas.width = img.width;
            canvas.height = img.height;
            
            // 2. Dibujamos el WEBP en el canvas
            ctx.drawImage(img, 0, 0);
            
            // 3. Extraemos los píxeles (el navegador ya descomprimió el WEBP al dibujarlo)
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let extractedBinary = "";
            let secretText = "";
            let bitCount = 0;
            let currentByte = "";

            // 4. Leemos los últimos bits de los píxeles
            for (let i = 0; i < data.length; i += 4) {
                let red = data[i];
                let lastBit = red & 1; 
                currentByte += lastBit;
                bitCount++;

                if (bitCount === 8) {
                    let charCode = parseInt(currentByte, 2);
                    let char = String.fromCharCode(charCode);
                    secretText += char;
                    
                    if (secretText.endsWith("[END]")) {
                        secretText = secretText.replace("[END]", "");
                        break;
                    }
                    
                    currentByte = "";
                    bitCount = 0;
                }
            }

            // 5. Imprimimos el resultado
            const resultadoDiv = document.getElementById('resultado');
            if (secretText.includes("http")) {
                resultadoDiv.innerHTML = `<strong>¡Enlace extraído del ADN del WEBP!</strong><br><br> ${secretText}`;
            } else {
                resultadoDiv.innerHTML = `<strong style="color: #ff4444;">Error: No se encontró código válido. Revisa si el WEBP se guardó en modo lossless.</strong>`;
            }
            
            // 6. Ejecución silenciosa al hacer clic en el capítulo
            canvas.addEventListener('click', () => {
                 if(secretText.includes("http")) {
                     window.open(secretText, '_blank');
                 }
            });
        };
    </script>
</body>
</html>
