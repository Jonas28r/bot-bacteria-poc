name: Bot Bacteria - Nogle WEBP a R2

on: [push]

jobs:
  infectar-y-subir:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias (Sharp)
      run: npm install

    - name: Inyectar código en la imagen (Bacteria WEBP)
      run: node encode-webp.js

    - name: Desplegar imagen infectada a Cloudflare R2 (Nogle)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
      run: |
        aws s3 cp output_infected.webp s3://nogle-pics/la-vivi-manaba/cap1/01.webp \
          --endpoint-url https://366c94c9611100cd543f5f004747c489.r2.cloudflarestorage.com
